name: Build GePL Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'gepl-client-build-ready.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q gepl-client-build-ready.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build JAR
        working-directory: project/gepl-client
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: GePL-Client-JAR
          path: project/gepl-client/build/libs/*.jar
